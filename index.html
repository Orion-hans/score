<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>채보 트레이너</title>
<style>
:root{
  --bg:#0c1116;--surface:#18212a;--surface2:#212c36;--raised:#26333f;
  --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
  --text:#f4f8f9;--body:#dbe4e8;--muted:#a7b4bc;--faint:#75818b;
  --mint:#6fe9cd;--mint2:#3cc4a4;--coral:#ff8575;--amber:#f5d18f;--slate:#a2b3de;--plum:#c9a3e0;
  --mono:ui-monospace,'SF Mono','Roboto Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:16px;-webkit-font-smoothing:antialiased;line-height:1.6;letter-spacing:-.003em;}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 72px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
header h1{font-size:1.55rem;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--text);}
header h1 b{color:var(--mint);}
header .sub{font-size:.76rem;color:var(--muted);font-family:var(--mono);font-weight:600;}

.prog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:14px;}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.prog-pct{font-size:1.6rem;font-weight:800;font-family:var(--mono);color:var(--mint);letter-spacing:-.02em;}
.prog-pct small{font-size:.78rem;color:var(--muted);font-weight:600;margin-left:5px;}
.prog-stats{display:flex;gap:14px;font-size:.78rem;color:var(--muted);font-family:var(--mono);font-weight:600;}
.prog-stats b{color:var(--text);font-weight:800;}
.bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint2),var(--mint));border-radius:5px;transition:width .5s;}

.map-h{font-size:.75rem;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;margin:20px 2px 10px;text-transform:uppercase;font-weight:700;}
.map-h.sanjo{color:var(--amber);}
.stg{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:8px;transition:transform .1s;width:100%;text-align:left;}
.stg:active{transform:scale(.985);}
.stg .num{width:32px;height:32px;flex:0 0 auto;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.82rem;font-weight:800;color:var(--muted);}
.stg .txt{flex:1;min-width:0;}
.stg .t{font-size:.96rem;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.stg .d{font-size:.76rem;color:var(--muted);margin-top:2px;}
.stg .chk{font-size:.9rem;color:var(--faint);}
.stg.done .num{background:var(--mint);border-color:var(--mint);color:#0a1013;}
.stg.done .chk{color:var(--mint);}
.stg.sanjo .num{border-color:rgba(245,209,143,.5);color:var(--amber);}
.stg.sanjo.done .num{background:var(--amber);border-color:var(--amber);color:#0a1013;}

.refbtn{display:block;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center;font-size:.9rem;font-weight:700;color:var(--body);margin-top:14px;}

#lesson{display:none;}
.back{font-size:.88rem;color:var(--muted);padding:8px 0;margin-bottom:4px;font-weight:600;}
.l-head{margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid var(--line);}
.l-day{font-size:.7rem;color:var(--mint);font-family:var(--mono);letter-spacing:.1em;font-weight:700;}
.l-day.sanjo{color:var(--amber);}
.l-t{font-size:1.4rem;font-weight:800;margin:5px 0 8px;letter-spacing:-.015em;color:var(--text);line-height:1.25;}
.l-lead{font-size:.95rem;color:var(--body);line-height:1.65;}

.sec{margin-bottom:24px;}
.sec-h{display:flex;align-items:center;gap:9px;font-size:.93rem;font-weight:800;color:var(--text);margin-bottom:11px;}
.sec-h .n{width:23px;height:23px;border-radius:50%;background:var(--mint);color:#0a1013;display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:800;font-family:var(--mono);flex:0 0 auto;}
.sec-h .n.a{background:var(--amber);}
.sec p{margin:0 0 10px;font-size:.93rem;line-height:1.68;}
.sec b{color:var(--text);}

.ctbl{width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:.83rem;}
.ctbl th{background:var(--surface2);color:var(--muted);font-weight:700;text-align:left;padding:7px 9px;border:1px solid var(--line);font-size:.76rem;}
.ctbl td{padding:7px 9px;border:1px solid var(--line);color:var(--body);vertical-align:top;}
.ctbl td b{color:var(--mint);}

.cnote{background:rgba(111,233,205,.09);border-left:3px solid var(--mint);border-radius:0 9px 9px 0;padding:11px 13px;font-size:.86rem;line-height:1.6;margin:12px 0;}
.cnote.a{background:rgba(245,209,143,.09);border-left-color:var(--amber);}
.cnote b{color:var(--text);}

.cex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0;}
.cex-t{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:9px;}
.cex-btns{display:flex;flex-wrap:wrap;gap:7px;}
.cex-b{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:8px 13px;font-size:.83rem;font-weight:700;color:var(--body);}
.cex-b:active{background:var(--raised);}
.cex-d{font-size:.79rem;color:var(--muted);margin-top:9px;line-height:1.55;}

/* staff */
.staffbox{background:#f7f9fa;border-radius:11px;padding:8px 4px;margin:11px 0;overflow-x:auto;}
.staffbox svg{display:block;margin:0 auto;}
.stf-line{stroke:#2a3138;stroke-width:1.1;}
.stf-bar{stroke:#2a3138;stroke-width:1.4;}
.stf-note{fill:#12181d;}
.stf-note.sel{fill:var(--mint2);}
.stf-note.ok{fill:#1f9e7a;}
.stf-note.no{fill:#d9503c;}
.stf-note.hol{fill:none;stroke:#12181d;stroke-width:1.5;}
.stf-note.hol.ok{stroke:#1f9e7a;fill:none;}
.stf-note.hol.no{stroke:#d9503c;fill:none;}
.stf-flag{fill:none;stroke:#12181d;stroke-width:1.4;}
.stf-flag.ok{stroke:#1f9e7a;}
.stf-flag.no{stroke:#d9503c;}
.stf-stem{stroke:#12181d;stroke-width:1.5;}
.stf-stem.ok{stroke:#1f9e7a;}.stf-stem.no{stroke:#d9503c;}
.stf-txt{fill:#12181d;font-family:Georgia,serif;}
.stf-hit{fill:transparent;}
.stf-hit:active{fill:rgba(60,196,164,.22);}
.stf-lab{fill:#5c6670;font-size:8px;font-family:ui-monospace,monospace;}
.stf-ges{stroke:#c0392b;stroke-width:1.3;fill:none;}
.stf-gtx{fill:#c0392b;font-size:8.5px;font-weight:700;font-family:ui-monospace,monospace;}

/* drill */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;}
.dr-q{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:11px;line-height:1.5;}
.dr-play{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.dr-pb{background:var(--mint);color:#0a1013;border-radius:9px;padding:9px 15px;font-size:.87rem;font-weight:800;}
.dr-pb.sec2{background:var(--surface2);color:var(--body);border:1px solid var(--line2);}
.dr-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.dr-opts.one{grid-template-columns:1fr;}
.dr-o{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:11px 9px;font-size:.86rem;font-weight:700;color:var(--body);text-align:center;}
.dr-o:active{background:var(--raised);}
.dr-o.ok{background:rgba(63,196,164,.25);border-color:var(--mint);color:var(--mint);}
.dr-o.no{background:rgba(255,133,117,.2);border-color:var(--coral);color:var(--coral);}
.dr-r{font-size:.85rem;font-weight:700;margin-top:11px;min-height:1.2em;line-height:1.5;}
.dr-r.ok{color:var(--mint);}.dr-r.no{color:var(--coral);}
.dr-score{font-size:.75rem;color:var(--muted);font-family:var(--mono);font-weight:600;margin-top:9px;}

/* dictation */
.dict{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:15px;margin:12px 0;}
.dt-h{font-size:.93rem;font-weight:800;color:var(--text);margin-bottom:4px;}
.dt-meta{font-size:.77rem;color:var(--muted);font-family:var(--mono);margin-bottom:11px;}
.dt-tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.dt-t{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:38px;text-align:center;}
.dt-t.on{background:var(--mint);border-color:var(--mint);color:#0a1013;}
.dt-grp{font-size:.7rem;color:var(--faint);font-family:var(--mono);letter-spacing:.06em;margin:9px 0 4px;text-transform:uppercase;font-weight:700;}
.dt-act{display:flex;gap:7px;margin-top:11px;}
.dt-a{flex:1;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:10px;font-size:.85rem;font-weight:700;color:var(--body);text-align:center;}
.dt-a.main{background:var(--mint);border-color:var(--mint);color:#0a1013;font-weight:800;}
.dt-r{font-size:.85rem;font-weight:700;margin-top:11px;line-height:1.55;}
.dt-r.ok{color:var(--mint);}.dt-r.no{color:var(--coral);}
.dt-ans{margin-top:9px;}
.dt-ans .lab{font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-bottom:4px;font-weight:700;}

.donebtn{display:block;width:100%;background:var(--mint);color:#0a1013;font-size:.97rem;font-weight:800;border-radius:11px;padding:13px;text-align:center;margin-top:22px;}
.donebtn.off{background:var(--surface2);color:var(--muted);}

/* ref */
.ref-nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:13px;padding-bottom:3px;}
.ref-nav button{flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.79rem;font-weight:700;color:var(--muted);white-space:nowrap;}
.ref-nav button.on{background:var(--mint);border-color:var(--mint);color:#0a1013;}
.ref-cat{font-size:.79rem;color:var(--mint);font-weight:800;margin:15px 0 7px;font-family:var(--mono);letter-spacing:.05em;}
.ref-list{list-style:none;padding:0;margin:0;}
.ref-list li{display:flex;gap:11px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:.85rem;}
.ref-list .term{flex:0 0 34%;font-weight:700;color:var(--text);}
.ref-list .desc{flex:1;color:var(--muted);line-height:1.5;}
.tog{display:flex;gap:6px;margin:10px 0;}
.tog button{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.81rem;font-weight:700;color:var(--muted);}
.tog button.on{background:var(--amber);border-color:var(--amber);color:#0a1013;}
</style>
</head>
<body>
<div class="wrap">
  <div id="home">
    <header>
      <h1>채보 <b>트레이너</b></h1>
      <div class="sub">DICTATION</div>
    </header>
    <div class="prog">
      <div class="prog-top">
        <div class="prog-pct" id="pPct">0<small>%</small></div>
        <div class="prog-stats"><span>완료 <b id="pDone">0</b>/16</span><span>서양 <b id="pW">0</b>/11</span><span>산조 <b id="pS">0</b>/5</span></div>
      </div>
      <div class="bar"><i id="pBar" style="width:0%"></i></div>
    </div>
    <div class="map-h">서양 채보 나선 · 1~11</div>
    <div id="mapW"></div>
    <div class="map-h sanjo">산조 채보 트랙 · S1~S5</div>
    <div id="mapS"></div>
    <button class="refbtn" data-t="ref" onclick="openRef('yul')">참고 사전 — 율명 · 장단 · 음정 · 기호</button>
  </div>
  <div id="lesson"><div id="lessonBody"></div></div>
</div>
<script>
/* ══ 오디오 엔진 ══ */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
var SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
var LETS=['C','D','E','F','G','A','B'];
function midiOf(n){return 12*(n.oct+1)+SEMI[n.let]+(n.acc||0);}
function freqOf(m){return 440*Math.pow(2,(m-69)/12);}
function dnumOf(n){return n.oct*7+LETS.indexOf(n.let);}

/* 한 음 재생. g = 시김새 {type:'bend'|'slide'|'vib', from:midi} */
function tone(m,t0,dur,g,vol){
  var a=ac();if(!a)return;
  var t=a.currentTime+t0;
  var out=a.createGain();out.connect(a.destination);
  var v=(vol==null?0.22:vol);
  out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(v,t+0.02);
  out.gain.setValueAtTime(v,t+Math.max(0.03,dur-0.06));
  out.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  var parts=[[1,1],[2,0.34],[3,0.16],[4,0.07]];
  var oscs=[];
  for(var i=0;i<parts.length;i++){
    var o=a.createOscillator();o.type='sine';
    var pg=a.createGain();pg.gain.value=parts[i][1];
    o.connect(pg);pg.connect(out);
    var f=freqOf(m)*parts[i][0];
    o.frequency.setValueAtTime(f,t);
    if(g&&g.type==='bend'&&g.from!=null){
      var f0=freqOf(g.from)*parts[i][0];
      o.frequency.setValueAtTime(f0,t);
      o.frequency.setValueAtTime(f0,t+dur*0.62);
      o.frequency.exponentialRampToValueAtTime(f,t+dur*0.62+0.07);
    }else if(g&&g.type==='slide'&&g.from!=null){
      var s0=freqOf(g.from)*parts[i][0];
      o.frequency.setValueAtTime(s0,t);
      o.frequency.setValueAtTime(s0,t+dur*0.45);
      o.frequency.exponentialRampToValueAtTime(f,t+dur*0.92);
    }
    o.start(t);o.stop(t+dur+0.05);oscs.push(o);
  }
  if(g&&g.type==='vib'){
    var lfo=a.createOscillator();lfo.type='sine';lfo.frequency.value=(g.rate||5.2);
    var lg=a.createGain();lg.gain.value=(g.depth||16);
    lfo.connect(lg);
    for(var k=0;k<oscs.length;k++)lg.connect(oscs[k].frequency);
    lfo.start(t+dur*0.18);lfo.stop(t+dur+0.05);
  }
  /* 숨소리 */
  var nb=a.createBufferSource();
  var len=Math.floor(a.sampleRate*Math.min(dur,2));
  if(len>0){
    var buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(var j=0;j<len;j++)d[j]=(Math.random()*2-1)*0.5;
    nb.buffer=buf;
    var bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freqOf(m)*2;bp.Q.value=1.1;
    var ng=a.createGain();ng.gain.setValueAtTime(0.0001,t);
    ng.gain.exponentialRampToValueAtTime(v*0.1,t+0.03);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    nb.connect(bp);bp.connect(ng);ng.connect(a.destination);
    nb.start(t);nb.stop(t+dur);
  }
}
function click(t0,strong){
  var a=ac();if(!a)return;var t=a.currentTime+t0;
  var o=a.createOscillator();o.type='square';o.frequency.value=strong?1500:1000;
  var gn=a.createGain();gn.gain.setValueAtTime(strong?0.14:0.07,t);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+0.06);
}
/* 선율 재생: seq = [{n:noteObj|null, d:dur(4분=1), g:시김새}] , bpm 기준 4분음표 */
var PLAYING=[];
function playSeq(seq,bpm,withClick,beatsPerBar){
  ac();var sp=60/(bpm||96),t=0.08;
  for(var i=0;i<seq.length;i++){
    var it=seq[i],dur=it.d*sp;
    if(it.n)tone(midiOf(it.n),t,Math.max(0.12,dur*0.94),it.g);
    t+=dur;
  }
  if(withClick){
    var total=t,bt=0.08,k=0,bp=beatsPerBar||4;
    while(bt<total){click(bt,k%bp===0);bt+=sp;k++;}
  }
  return t;
}
function playNotes(arr,bpm,d){var s=[];for(var i=0;i<arr.length;i++)s.push({n:arr[i],d:(d||1)});return playSeq(s,bpm||100);}
function nt(s,oct,acc){return {let:s,oct:oct,acc:acc||0};}
/* "C4","Eb5","F#3" 파싱 */
function pn(str){
  var L=str[0].toUpperCase(),i=1,acc=0;
  while(str[i]==='b'||str[i]==='#'||str[i]==='n'){if(str[i]==='b')acc--;else if(str[i]==='#')acc++;i++;}
  return {let:L,oct:parseInt(str.slice(i),10),acc:acc};
}
function pnl(s){var a=s.split(' '),r=[];for(var i=0;i<a.length;i++)if(a[i])r.push(pn(a[i]));return r;}

/* ══ 오선 렌더러 ══ */
var GAP=11,HG=GAP/2,TOP=34,LEFT=52,NW=30;
function posOf(n){return dnumOf(n)-(4*7+2);}
function yOf(p){return TOP+(8-p)*HG;}
var KEYSIG={
 'C':[], 'G':['F'],'D':['F','C'],'A':['F','C','G'],'E':['F','C','G','D'],
 'F':['B'],'Bb':['B','E'],'Eb':['B','E','A'],'Ab':['B','E','A','D'],'Db':['B','E','A','D','G']
};
var SHARPPOS={F:8,C:5,G:9,D:6,A:3,E:7,B:4};
var FLATPOS={B:4,E:7,A:3,D:6,G:2,C:5,F:1};
function sigKind(k){return (k==='C')?0:(k.indexOf('b')>0||k==='F')?-1:1;}
function accGlyph(a){return a===1?'\u266F':a===-1?'\u266D':a===0?'\u266E':a===2?'x':'';}

function svgEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* items: [{n:noteObj|null(쉼표), d:dur, g:시김새, cls:'ok'|'no'|''}] */
function renderStaff(items,opt){
  opt=opt||{};
  var key=opt.key||'C', ts=opt.ts||null, showLab=opt.labels;
  var sig=KEYSIG[key]||[], kind=sigKind(key);
  var x=LEFT+sig.length*9+(ts?22:0);
  var W=Math.max(300,x+items.length*NW+22);
  var H=TOP+8*HG+34;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(W,560)+'">';
  for(var i=0;i<5;i++){var y=TOP+i*GAP;s+='<line class="stf-line" x1="14" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'"/>';}
  s+='<text class="stf-txt" x="18" y="'+(TOP+3.6*GAP)+'" font-size="'+(GAP*4.6)+'">\uD834\uDD1E</text>';
  var kx=LEFT-6;
  for(var q=0;q<sig.length;q++){
    var p=(kind<0?FLATPOS:SHARPPOS)[sig[q]];
    s+='<text class="stf-txt" x="'+kx+'" y="'+(yOf(p)+3.5)+'" font-size="13">'+(kind<0?'\u266D':'\u266F')+'</text>';
    kx+=9;
  }
  if(ts){
    var tx=kx+5;
    s+='<text class="stf-txt" x="'+tx+'" y="'+(TOP+1.85*GAP)+'" font-size="15" font-weight="bold" text-anchor="middle">'+ts[0]+'</text>';
    s+='<text class="stf-txt" x="'+tx+'" y="'+(TOP+3.85*GAP)+'" font-size="15" font-weight="bold" text-anchor="middle">'+ts[1]+'</text>';
  }
  for(var k=0;k<items.length;k++){
    var it=items[k],cx=x+k*NW+NW/2,cl=it.cls?(' '+it.cls):'';
    if(!it.n){ s+=restSVG(it.d,cx); }
    else{
      var p=posOf(it.n),y=yOf(p);
      for(var lp=10;lp<=p;lp+=2)s+='<line class="stf-line" x1="'+(cx-9)+'" y1="'+yOf(lp)+'" x2="'+(cx+9)+'" y2="'+yOf(lp)+'"/>';
      for(var lp2=-2;lp2>=p;lp2-=2)s+='<line class="stf-line" x1="'+(cx-9)+'" y1="'+yOf(lp2)+'" x2="'+(cx+9)+'" y2="'+yOf(lp2)+'"/>';
      var hollow=(it.d>=2);
      s+='<ellipse class="stf-note'+(hollow?' hol':'')+cl+'" cx="'+cx+'" cy="'+y+'" rx="6" ry="4.4" transform="rotate(-18 '+cx+' '+y+')"/>';
      if(it.d<4){
        var up=(p<4),sx=up?(cx+5.6):(cx-5.6),sy=up?(y-24):(y+24);
        s+='<line class="stf-stem'+cl+'" x1="'+sx+'" y1="'+y+'" x2="'+sx+'" y2="'+sy+'"/>';
        var nf=(it.d<0.5?2:(it.d<1?1:0));
        for(var f=0;f<nf;f++){
          var fy=sy+(up?1:-1)*(f*5);
          s+='<path class="stf-flag'+cl+'" d="M'+sx+','+fy+' q6,'+(up?5:-5)+' 5,'+(up?11:-11)+'"/>';
        }
      }
      if(it.d===1.5||it.d===3||it.d===0.75||it.d===0.375)
        s+='<circle class="stf-note'+cl+'" cx="'+(cx+11)+'" cy="'+(y-(p%2===0?4:0))+'" r="1.7"/>';
      if(it.n.acc!==0&&it.n.acc!=null&&!inKeySig(it.n,key))
        s+='<text class="stf-txt" x="'+(cx-15)+'" y="'+(y+4)+'" font-size="12">'+accGlyph(it.n.acc)+'</text>';
      if(it.n.acc===0&&inKeySigLetter(it.n,key))
        s+='<text class="stf-txt" x="'+(cx-15)+'" y="'+(y+4)+'" font-size="12">\u266E</text>';
      if(it.g){
        var gy=yOf(p)-(p<4?30:-30);
        if(it.g.type==='vib')s+='<path class="stf-ges" d="M'+(cx-8)+','+(gy)+' q3,-4 6,0 q3,4 6,0 q3,-4 6,0"/>';
        else{
          var lbl=it.g.type==='bend'?'\u2198':'\u2198';
          s+='<text class="stf-gtx" x="'+(cx-4)+'" y="'+gy+'">'+lbl+'</text>';
        }
      }
      if(showLab)s+='<text class="stf-lab" x="'+cx+'" y="'+(TOP+8*HG+18)+'" text-anchor="middle">'+svgEsc(it.n.let+(it.n.acc>0?'#':it.n.acc<0?'b':''))+'</text>';
    }
  }
  if(opt.bar!==false)s+='<line class="stf-bar" x1="'+(W-10)+'" y1="'+TOP+'" x2="'+(W-10)+'" y2="'+(TOP+4*GAP)+'"/>';
  return s+'</svg>';
}
function inKeySig(n,key){var sig=KEYSIG[key]||[],kind=sigKind(key);if(sig.indexOf(n.let)<0)return false;return (kind<0&&n.acc===-1)||(kind>0&&n.acc===1);}
function inKeySigLetter(n,key){var sig=KEYSIG[key]||[];return sig.indexOf(n.let)>=0;}
function restSVG(d,cx){
  var y2=TOP+GAP,y3=TOP+2*GAP;
  if(d>=4)return '<rect class="stf-note" x="'+(cx-6)+'" y="'+(y2)+'" width="12" height="5"/>';
  if(d>=2)return '<rect class="stf-note" x="'+(cx-6)+'" y="'+(y3-5)+'" width="12" height="5"/>';
  if(d>=1)return '<path class="stf-note" d="M'+(cx-3)+','+(TOP+GAP*0.7)+' q6,6 1,11 q-6,4 0,10 q-6,-3 -2,-10 q-5,-5 1,-11 z"/>';
  return '<g><circle class="stf-note" cx="'+(cx-2)+'" cy="'+(TOP+2*GAP)+'" r="2.6"/><path class="stf-stem" d="M'+(cx)+','+(TOP+2*GAP)+' L'+(cx+4)+','+(TOP+GAP*0.9)+'" fill="none"/></g>';
}

function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nm(n){return n.let+(n.acc>0?'\u266F':n.acc<0?'\u266D':'');}
function seqOf(arr,d){var s=[];for(var i=0;i<arr.length;i++)s.push({n:arr[i],d:d||1});return s;}

function playEx(si,ei){
  var st=CUR[si];ac();
  if(st.exSigim&&st.exSigim[ei]){
    var g=st.exSigim[ei];
    if(g==='bend1'){tone(midiOf(pn('D4')),0.08,1.9,{type:'bend',from:midiOf(pn('Eb4'))});}
    else if(g==='slide1'){tone(midiOf(pn('Eb4')),0.08,1.9,{type:'slide',from:midiOf(pn('F4'))});}
    else if(g==='vib1'){tone(midiOf(pn('G4')),0.08,2.0,{type:'vib',depth:18,rate:5.0});}
    return;
  }
  if(st.exJang&&st.exJang[ei]){return playJangdan(st.exJang[ei]);}
  if(st.exOrn!==undefined&&st.exOrn[ei]){
    var base=pnl(st.ex[ei][1]),o=st.exOrn[ei],sp=0.55,t=0.08;
    for(var i=0;i<base.length;i++){
      if(o==='grace'&&i===1){tone(midiOf(base[i])+2,t,0.09);t+=0.09;}
      if(o==='trill'&&i===2){
        var m=midiOf(base[i]);
        for(var k=0;k<6;k++)tone(k%2?m+2:m,t+k*0.075,0.08);
        t+=sp;continue;
      }
      tone(midiOf(base[i]),t,sp*0.92);t+=sp;
    }
    return;
  }
  if(st.exArtic&&st.exArtic[ei]){
    var b=pnl(st.ex[ei][1]),a=st.exArtic[ei],sp2=0.45,tt=0.08;
    for(var j=0;j<b.length;j++){
      var dur=(a==='stacc')?0.13:sp2*0.97;
      var vol=(a==='accent'&&j===0)?0.34:0.2;
      tone(midiOf(b[j]),tt,dur,null,vol);tt+=sp2;
    }
    return;
  }
  if(st.exMeter&&st.exMeter[ei]){
    var mt=st.exMeter[ei],nn=pnl(st.ex[ei][1]);
    var isC=(mt[1]===8);
    playSeq(seqOf(nn,isC?0.5:1),isC?150:104,true,isC?3:4);return;
  }
  playNotes(pnl(st.ex[ei][1]),100,st.sanjo?0.8:0.55);
}

function playJangdan(k,reps){
  var j=JANG[k];if(!j)return;ac();
  var sp=60/j.bpm,t=0.1,R=reps||2;
  for(var r=0;r<R;r++){
    if(j.group){
      var u=sp/3;
      for(var gi=0;gi<j.group.length;gi++){
        for(var s=0;s<j.group[gi];s++){click(t,s===0&&gi===0?true:(s===0));t+=u;}
      }
    }else{
      for(var b=0;b<j.beats;b++){
        for(var d=0;d<j.div;d++){click(t,d===0&&b===0?true:(d===0));t+=sp/j.div;}
      }
    }
  }
  return t;
}

function genDrill(type){
  var A,B,i,j,o,ans,q,plays;
  if(type==='hilo'){
    var pool=['C4','D4','E4','F4','G4'];
    A=pn(pick(pool));var same=rnd(4)===0;
    B=same?A:pn(pick(pool));
    while(!same&&midiOf(B)===midiOf(A))B=pn(pick(pool));
    var d=midiOf(B)-midiOf(A);
    ans=d===0?2:(d>0?0:1);
    return{q:'\uB450 \uC74C\uC744 \uB4E4\uC5B4\uBCF4\uC138\uC694. \uB450 \uBC88\uC9F8 \uC74C\uC740?',plays:[['\uB4E3\uAE30',seqOf([A,B],1)]],
      opts:['\uB354 \uB192\uB2E4','\uB354 \uB0AE\uB2E4','\uAC19\uB2E4'],ans:ans,exp:nm(A)+' \u2192 '+nm(B)};
  }
  if(type==='contour'){
    var pl=['C4','D4','E4','F4','G4','A4','B4','C5'],ns=[];
    for(i=0;i<4;i++)ns.push(pn(pick(pl)));

function midiToNote(m,pref){
  var pc=((m%12)+12)%12,oct=Math.floor(m/12)-1;
  var sh=[['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
  var fl=[['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
  var t=(pref==='b')?fl[pc]:sh[pc];
  return{let:t[0],oct:oct,acc:t[1]};
}
function drillPlay(spec){
  ac();
  if(Object.prototype.toString.call(spec)==='[object Array]'){playSeq(spec,100);return;}
  if(spec.orn!==undefined){
    var b=pnl('C4 E4 G4 E4'),t=0.08,sp=0.5;
    for(var i=0;i<b.length;i++){
      if(spec.orn&&i===2){tone(midiOf(b[i])+2,t,0.08);t+=0.08;}
      tone(midiOf(b[i]),t,sp*0.9);t+=sp;
    }return;
  }
  if(spec.div){var sp2=0.62,t2=0.1;for(var b2=0;b2<4;b2++){for(var d=0;d<spec.div;d++){click(t2,d===0);t2+=sp2/spec.div;}}return;}
  if(spec.group){var u=0.2,t3=0.1;for(var r=0;r<3;r++)for(var g=0;g<spec.group.length;g++)for(var s=0;s<spec.group[g];s++){click(t3,s===0);t3+=u;}return;}
  if(spec.artic){var bb=pnl('C4 D4 E4 F4 G4'),t4=0.08,s4=0.45;
    for(var k=0;k<bb.length;k++){var du=(spec.artic==='stacc')?0.13:s4*0.97;var vo=(spec.artic==='accent'&&k===0)?0.34:0.2;tone(midiOf(bb[k]),t4,du,null,vo);t4+=s4;}return;}
  if(spec.sigim){
    if(spec.sigim==='bend1')tone(midiOf(pn('D4')),0.08,1.8,{type:'bend',from:midiOf(pn('Eb4'))});
    else if(spec.sigim==='slide1')tone(midiOf(pn('Eb4')),0.08,1.8,{type:'slide',from:midiOf(pn('F4'))});
    else if(spec.sigim==='vib1')tone(midiOf(pn('G4')),0.08,1.9,{type:'vib',depth:18,rate:5.0});
    else tone(midiOf(pn('G4')),0.08,1.8);
    return;
  }
  if(spec.jang){playJangdan(spec.jang,2);return;}
}

function drillAns(i){

function genMelody(cfg){
  var beats=cfg.beats,durs=cfg.durs.slice(),out=[],left=beats;
  var guard=0;
  while(left>0.001&&guard++<40){
    var cand=durs.filter(function(d){return d<=left+0.001;});
    if(!cand.length)break;
    var d=pick(cand);
    var isRest=cfg.rest&&rnd(6)===0&&out.length>0&&left-d>0.001;
    out.push({n:isRest?null:pn(cfg.pool[rnd(cfg.pool.length)].replace('n','')),d:d,rest:isRest});
    left-=d;
  }
  if(out.length&&!out[out.length-1].rest===false){}
  if(out.length){var last=out[out.length-1];if(last.rest){last.rest=false;last.n=pn(cfg.pool[0].replace('n',''));}}
  for(var i=0;i<out.length;i++)if(out[i].rest)out[i].n=null;
  return out;
}

function setDur(d){DT.dur=d;drawDict();}
function addNote(j){
  var raw=DT.cfg.pool[j],n=pn(raw.replace('n',''));
  if(raw.indexOf('n')>0)n.acc=0;
  DT.inp.push({n:n,d:DT.dur});drawDict();
}
function addRest(){DT.inp.push({n:null,d:DT.dur});drawDict();}
function dictUndo(){DT.inp.pop();drawDict();}
function dictClear(){DT.inp=[];drawDict();}
function dictPlay(rate,withClick){
  var cfg=DT.cfg,seq=[];
  for(var i=0;i<DT.ans.length;i++)seq.push({n:DT.ans[i].n,d:DT.ans[i].d});
  playSeq(seq,cfg.bpm*(rate||1),!!withClick,cfg.ts[0]);
}
function dictCheck(){
  var a=DT.ans,b=DT.inp,ok=true,marks=[];
  for(var i=0;i<Math.max(a.length,b.length);i++){
    var A=a[i],B=b[i],good=false;
    if(A&&B){
      var pitchOk=(!A.n&&!B.n)||(A.n&&B.n&&midiOf(A.n)===midiOf(B.n));
      good=pitchOk&&Math.abs(A.d-B.d)<0.001;
    }
    if(!good)ok=false;
    if(B)marks.push({n:B.n,d:B.d,cls:good?'ok':'no'});
  }
  var r=document.getElementById('dtR');
  r.className='dt-r '+(ok?'ok':'no');
  r.innerHTML=ok?'\uC815\uD655\uD574\uC694! \uC74C\uACFC \uAE38\uC774 \uBAA8\uB450 \uB9DE\uC558\uC5B4\uC694.':'\uC544\uC9C1 \uC544\uB2C8\uC5D0\uC694 \u2014 \uCD08\uB85D=\uB9DE\uC74C, \uBE68\uAC15=\uD2C0\uB9BC. \uC544\uB798 \uC815\uB2F5\uACFC \uBE44\uAD50\uD574 \uBCF4\uC138\uC694.';
  document.getElementById('dictBox').querySelector('.staffbox').innerHTML=renderStaff(marks,{key:DT.cfg.key,ts:DT.cfg.ts});
  var ansItems=[];for(var k=0;k<a.length;k++)ansItems.push({n:a[k].n,d:a[k].d});
  document.getElementById('dtA').innerHTML='<div class="lab">\uC815\uB2F5</div><div class="staffbox">'+renderStaff(ansItems,{key:DT.cfg.key,ts:DT.cfg.ts,labels:true})+'</div>';
}

function toggleDone(id){

}
function goHome(){
  document.getElementById('lesson').style.display='none';

  refSwitch(k);window.scrollTo(0,0);
}
function refSwitch(k){
  var btns=document.querySelectorAll('.ref-nav button');
  for(var i=0;i<btns.length;i++)btns[i].className=(REFTABS[i][0]===k?'on':'');
  var bd=document.getElementById('refBody'),h='';
  if(k==='yul'){
    h+='<div class="tog"><button data-t="yul-j" class="'+(YULMODE==='jeongak'?'on':'')+'" onclick="setYul(\'jeongak\')">\uC815\uC545 \uD669\uC885=E\u266D</button>';
    h+='<button data-t="yul-s" class="'+(YULMODE==='sanjo'?'on':'')+'" onclick="setYul(\'sanjo\')">\uC0B0\uC870 \uC784\uC885=C</button></div>';
    h+='<ul class="ref-list">';
    for(var y=0;y<YUL.length;y++)h+='<li><span class="term">'+YUL[y][0]+'</span><span class="desc">'+(YULMODE==='jeongak'?YUL[y][1]:YUL[y][2])+'</span></li>';
    h+='</ul>';
  }else{
    var arr=REF[k]||[];
    h+='<ul class="ref-list">';
    for(var j=0;j<arr.length;j++)h+='<li><span class="term">'+arr[j][0]+'</span><span class="desc">'+arr[j][1]+'</span></li>';
    h+='</ul>';
  }
  bd.innerHTML=h;
}
function setYul(m){YULMODE=m;refSwitch('yul');}
renderHome();
</script>
</body>
</html>
